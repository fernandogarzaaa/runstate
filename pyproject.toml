[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runstate"
version = "0.1.0"
description = "Stateful agent orchestration runtime: budgeted, resumable, receipted agent runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Fernando Garza" }]
keywords = ["agents", "mcp", "orchestration", "llm"]
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.27",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
runstate = "runstate.cli:main"

[project.urls]
Repository = "https://github.com/fernandogarzaaa/runstate"

[tool.setuptools.packages.find]
where = ["."]
include = ["runstate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
